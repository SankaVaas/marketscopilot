services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - postgres
      - minio
    volumes:
      - ./data:/code/data
      - ./eval:/code/eval

  # --- Ollama: only needed if using LOCAL inference instead of Groq ---
  # Uncomment this block and re-add "ollama" to app's depends_on above
  # if you switch LLM_BASE_URL back to http://ollama:11434/v1
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketscopilot
      POSTGRES_USER: marketscopilot
      POSTGRES_PASSWORD: change-me-locally
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC

  # --- Optional: uncomment for production-grade GPU serving instead of Ollama ---
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: ["--model", "Qwen/Qwen2.5-14B-Instruct-AWQ", "--quantization", "awq", "--port", "8001"]
  #   ports:
  #     - "8001:8001"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  # ollama_models:   # only needed if using local Ollama inference
  qdrant_data:
  postgres_data:
  minio_data:
